<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>影子变变变</title>
<style>
:root {
  --bg: #0f1420;
  --surface: #1b2236;
  --text: #f0f4ff;
  --muted: #8a93b0;
  --accent: #ffd34e;
  --border: #2e3850;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100vh;
  display: grid;
  grid-template-rows: 1fr auto;
  max-width: 900px;
  margin: 0 auto;
}
.scene-wrap {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 150px;
  gap: 10px;
  padding: 10px;
  overflow: hidden;
  min-height: 0;
}
.scene {
  position: relative;
  background: var(--surface);
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--border);
  touch-action: none;
  user-select: none;
}
.scene svg {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  font-size: 13px;
  min-width: 0;
}
.panel h3 {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}
.ruler {
  height: 14px;
  background: rgba(255,255,255,0.06);
  border-radius: 8px;
  overflow: hidden;
  position: relative;
  border: 1px solid var(--border);
}
.ruler-fill {
  height: 100%;
  background: linear-gradient(90deg, #4a5570, var(--accent));
  border-radius: 8px;
  width: 0%;
  transition: width 180ms ease;
}
.ruler-text {
  font-size: 12px;
  color: var(--text);
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.compass {
  width: 100%;
  aspect-ratio: 1;
  position: relative;
  max-width: 120px;
  margin: 0 auto;
}
.compass svg { width: 100%; height: 100%; }
.arrow { transform-origin: 50% 50%; transition: transform 200ms ease; }

.prompt {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 10;
  opacity: 0;
  pointer-events: none;
  transition: opacity 250ms;
  backdrop-filter: blur(2px);
}
.prompt.show { opacity: 1; pointer-events: auto; }
.prompt-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px 20px;
  max-width: 340px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.prompt-card h2 {
  font-size: 17px;
  margin-bottom: 18px;
  line-height: 1.55;
  color: var(--text);
}
.prompt-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.prompt-btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 14px 12px;
  border-radius: 10px;
  font-size: 15px;
  cursor: pointer;
  transition: background 150ms, border-color 150ms, transform 100ms;
  min-height: 48px;
  font-family: inherit;
}
.prompt-btn:hover { background: rgba(255,255,255,0.12); border-color: var(--accent); }
.prompt-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.prompt-btn:active { transform: scale(0.97); }

.hint {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.55);
  padding: 8px 16px;
  border-radius: 16px;
  font-size: 13px;
  pointer-events: none;
  z-index: 5;
  transition: opacity 400ms;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.1);
}
.hint.hidden { opacity: 0; }

.parent-zone {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 12px 18px;
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.65;
}
.parent-zone strong { color: var(--text); margin-right: 4px; }

.toast {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(0,0,0,0.7);
  color: #fff;
  padding: 8px 16px;
  border-radius: 16px;
  font-size: 13px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 200ms, transform 200ms;
  z-index: 6;
  white-space: nowrap;
  max-width: 90%;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 600px) {
  .scene-wrap {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr 110px;
  }
  .panel {
    flex-direction: row;
    gap: 12px;
    padding: 10px;
  }
  .panel > div { flex: 1; min-width: 0; }
  .compass { max-width: 80px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <div class="scene-wrap">
    <div class="scene" id="scene">
      <svg id="svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#16224a"/>
            <stop offset="100%" stop-color="#7eb0d8"/>
          </linearGradient>
          <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5a8c4f"/>
            <stop offset="100%" stop-color="#2c4a26"/>
          </linearGradient>
          <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff5c8"/>
            <stop offset="55%" stop-color="#ffd34e"/>
            <stop offset="100%" stop-color="#f59c1e"/>
          </radialGradient>
        </defs>

        <rect x="0" y="0" width="400" height="320" fill="url(#sky)"/>

        <g id="stars" opacity="0">
          <circle cx="40" cy="40" r="1.4" fill="#fff"/>
          <circle cx="100" cy="70" r="1" fill="#fff"/>
          <circle cx="320" cy="50" r="1.4" fill="#fff"/>
          <circle cx="360" cy="100" r="1" fill="#fff"/>
          <circle cx="60" cy="150" r="1" fill="#fff"/>
          <circle cx="280" cy="180" r="1.2" fill="#fff"/>
          <circle cx="180" cy="40" r="1" fill="#fff"/>
          <circle cx="220" cy="120" r="1" fill="#fff"/>
          <circle cx="340" cy="220" r="1" fill="#fff"/>
          <circle cx="80" cy="240" r="1" fill="#fff"/>
        </g>

        <!-- 太阳（被草地遮挡以模拟下山） -->
        <g id="sun">
          <g id="sunRays" stroke="#ffd34e" stroke-width="2.5" stroke-linecap="round">
            <line x1="200" y1="76" x2="200" y2="64"/>
            <line x1="200" y1="164" x2="200" y2="176"/>
            <line x1="156" y1="120" x2="144" y2="120"/>
            <line x1="244" y1="120" x2="256" y2="120"/>
            <line x1="168" y1="88" x2="160" y2="80"/>
            <line x1="232" y1="152" x2="240" y2="160"/>
            <line x1="232" y1="88" x2="240" y2="80"/>
            <line x1="168" y1="152" x2="160" y2="160"/>
          </g>
          <circle cx="200" cy="120" r="28" fill="url(#sunGrad)" stroke="#f59c1e" stroke-width="2"/>
          <circle cx="194" cy="114" r="6" fill="rgba(255,255,255,0.4)"/>
        </g>

        <rect x="0" y="320" width="400" height="180" fill="url(#grass)"/>
        <!-- 草丛装饰 -->
        <g opacity="0.5">
          <path d="M30 320 L34 308 L38 320 Z" fill="#3a6b30"/>
          <path d="M70 320 L75 312 L80 320 Z" fill="#3a6b30"/>
          <path d="M310 320 L314 308 L318 320 Z" fill="#3a6b30"/>
          <path d="M350 320 L355 312 L360 320 Z" fill="#3a6b30"/>
        </g>

        <!-- 影子 -->
        <ellipse id="shadow" cx="200" cy="322" rx="0" ry="6" fill="rgba(0,0,0,0.42)"/>

        <!-- 小人（纸片人） -->
        <g id="person" transform="translate(200, 320)">
          <rect x="-8" y="-50" width="16" height="42" fill="#f0e6d0" stroke="#3a2e1a" stroke-width="2" rx="2"/>
          <rect x="-7" y="-8" width="5" height="12" fill="#f0e6d0" stroke="#3a2e1a" stroke-width="2"/>
          <rect x="2" y="-8" width="5" height="12" fill="#f0e6d0" stroke="#3a2e1a" stroke-width="2"/>
          <rect x="-15" y="-44" width="6" height="22" fill="#f0e6d0" stroke="#3a2e1a" stroke-width="2" rx="2"/>
          <rect x="9" y="-44" width="6" height="22" fill="#f0e6d0" stroke="#3a2e1a" stroke-width="2" rx="2"/>
          <circle cx="0" cy="-60" r="11" fill="#f8d8b0" stroke="#3a2e1a" stroke-width="2"/>
          <path d="M-11 -60 Q-13 -64 -10 -68" fill="none" stroke="#3a2e1a" stroke-width="2"/>
          <path d="M11 -60 Q13 -64 10 -68" fill="none" stroke="#3a2e1a" stroke-width="2"/>
          <circle cx="-3.5" cy="-61" r="1.2" fill="#3a2e1a"/>
          <circle cx="3.5" cy="-61" r="1.2" fill="#3a2e1a"/>
          <path d="M-3 -56 Q0 -54 3 -56" stroke="#3a2e1a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <circle cx="-6" cy="-58" r="1.5" fill="#ff9e9e" opacity="0.5"/>
          <circle cx="6" cy="-58" r="1.5" fill="#ff9e9e" opacity="0.5"/>
        </g>
      </svg>

      <div class="hint" id="hint">用手指拖动太阳 ☀️ 转一圈</div>
      <div class="toast" id="toast"></div>

      <div class="prompt" id="prompt">
        <div class="prompt-card">
          <h2 id="promptTitle"></h2>
          <div class="prompt-options" id="promptOptions"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div>
        <h3>影子长度</h3>
        <div class="ruler"><div class="ruler-fill" id="rulerFill"></div></div>
        <div class="ruler-text" id="rulerText">短短的</div>
      </div>
      <div>
        <h3>影子方向</h3>
        <div class="compass">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="42" fill="rgba(255,255,255,0.04)" stroke="var(--border)" stroke-width="1.5"/>
            <circle cx="50" cy="50" r="3" fill="var(--muted)"/>
            <text x="50" y="14" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="system-ui">北</text>
            <text x="89" y="54" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="system-ui">东</text>
            <text x="50" y="93" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="system-ui">南</text>
            <text x="11" y="54" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="system-ui">西</text>
            <g id="arrow" class="arrow">
              <path d="M50 14 L44 28 L50 25 L56 28 Z" fill="var(--accent)"/>
              <line x1="50" y1="25" x2="50" y2="50" stroke="var(--accent)" stroke-width="2"/>
            </g>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div class="parent-zone">
    <strong>给家长看：</strong>孩子刚刚拖动太阳围着小人转了一圈，自己观察出"太阳越高影子越短，太阳越低影子越长，太阳下山影子就消失"。生活中可以一起在早晨、中午、傍晚站在阳光下，用粉笔在地上画出影子的轮廓，对比一天中影子长短和方向的变化。注意：路灯、手电筒、月亮都能照出影子，规律和太阳一样——光从哪个方向来，影子就朝反方向跑。
  </div>
</div>

<script>
window.curiositySay = window.curiositySay || function (t) { try { var u = new SpeechSynthesisUtterance(String(t)); u.lang = 'zh-CN'; u.rate = 0.95; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} };

(function () {
  const svg = document.getElementById('svg');
  const scene = document.getElementById('scene');
  const sun = document.getElementById('sun');
  const sunRays = document.getElementById('sunRays');
  const stars = document.getElementById('stars');
  const shadow = document.getElementById('shadow');
  const hint = document.getElementById('hint');
  const toast = document.getElementById('toast');
  const rulerFill = document.getElementById('rulerFill');
  const rulerText = document.getElementById('rulerText');
  const arrow = document.getElementById('arrow');

  const CX = 200, CY = 320;       // 圆心 = 小人脚部
  const R = 180;                   // 太阳轨道半径
  const PERSON_H = 60;             // 小人头顶到脚的高度
  const MAX_SHADOW = 175;

  let angle = -Math.PI / 2;        // 起始：正上方（中午）
  let dragging = false;
  let hasInteracted = false;
  let sawLong = false;             // 见过影子变长
  let sawGone = false;             // 见过影子消失
  let promptShown = false;
  let finalShown = false;
  let lastSay = 0;
  let lastZone = '';

  function svgPoint(clientX, clientY) {
    const rect = svg.getBoundingClientRect();
    const vb = svg.viewBox.baseVal;
    return {
      x: (clientX - rect.left) / rect.width * vb.width,
      y: (clientY - rect.top) / rect.height * vb.height
    };
  }

  function say(text) {
    const now = Date.now();
    if (now - lastSay < 1100) return;
    lastSay = now;
    curiositySay(text);
  }

  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  function setSunByAngle(a) {
    angle = a;
    const sx = CX + R * Math.cos(a);
    const sy = CY + R * Math.sin(a);
    sun.setAttribute('transform', `translate(${sx - 200}, ${sy - 120})`);
    updateScene(sx, sy);
  }

  function updateScene(sx, sy) {
    const dx = sx - CX;
    const dy = sy - CY;

    // 夜晚处理
    if (dy > 4) {
      stars.style.opacity = Math.min(1, (dy - 4) / 30);
      sunRays.style.opacity = Math.max(0, 1 - (dy - 4) / 20);
    } else {
      stars.style.opacity = 0;
      sunRays.style.opacity = 1;
    }

    // 影子
    if (dy > 0) {
      // 太阳在地平线下，影子消失
      shadow.setAttribute('rx', 0);
      shadow.style.opacity = 0;
      rulerFill.style.width = '0%';
      rulerText.textContent = '没有影子';
      arrow.style.opacity = 0.3;
      if (!sawGone) {
        sawGone = true;
        showToast('太阳下山啦，影子也睡觉了');
        say('太阳下山啦，影子也睡觉了。');
      }
      maybeShowPrompt();
      return;
    }

    arrow.style.opacity = 1;
    const sunHeight = -dy;  // 太阳在地平线上的高度
    let len = PERSON_H * Math.abs(dx) / (sunHeight + PERSON_H);
    len = Math.min(len, MAX_SHADOW);
    len = Math.max(len, 0);

    if (Math.abs(dx) < 2 || len < 1) {
      // 太阳几乎在头顶
      shadow.setAttribute('rx', 0);
      shadow.style.opacity = 0;
      rulerFill.style.width = '3%';
      rulerText.textContent = '最短啦';
      arrow.style.opacity = 0.3;
      if (hasInteracted && lastZone !== 'top') {
        lastZone = 'top';
        showToast('影子躲到脚底下啦');
        say('影子躲到脚底下啦。');
      }
      return;
    }

    const dir = dx > 0 ? -1 : 1;
    const centerX = CX + dir * len / 2;
    shadow.setAttribute('cx', centerX);
    shadow.setAttribute('rx', len / 2);
    shadow.setAttribute('ry', 5 + len * 0.04);
    shadow.style.opacity = 0.42;

    const pct = Math.min(100, len / MAX_SHADOW * 100);
    rulerFill.style.width = pct + '%';
    if (pct < 20) rulerText.textContent = '短短的';
    else if (pct < 55) rulerText.textContent = '中等';
    else if (pct < 85) rulerText.textContent = '长长的';
    else rulerText.textContent = '最长！';

    // 箭头方向：影子指向（与太阳水平方向相反）
    let shadowDeg;
    if (dx > 0) shadowDeg = 270;        // 太阳在东，影子向西
    else shadowDeg = 90;                // 太阳在西，影子向东
    arrow.style.transform = `rotate(${shadowDeg}deg)`;

    // 状态反馈
    if (hasInteracting()) {
      if (pct > 85 && lastZone !== 'long') {
        lastZone = 'long';
        showToast('哇，最长的影子！');
        say('哇，这是最长的影子！');
        if (!sawLong) {
          sawLong = true;
          maybeShowPrompt();
        }
      } else if (pct >= 20 && pct < 55 && lastZone !== 'mid') {
        lastZone = 'mid';
      }
    }
  }

  function hasInteracting() { return hasInteracted; }

  function maybeShowPrompt() {
    if (promptShown) return;
    if (sawLong && sawGone) {
      promptShown = true;
      setTimeout(showPredictPrompt, 600);
    }
  }

  // 拖动
  function onPointerDown(e) {
    dragging = true;
    scene.setPointerCapture && scene.setPointerCapture(e.pointerId);
    if (!hasInteracted) {
      hasInteracted = true;
      hint.classList.add('hidden');
      setTimeout(() => say('你看到影子了吗？把太阳拖到旁边试试。'), 250);
    }
    onPointerMove(e);
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!dragging) return;
    const pt = svgPoint(e.clientX, e.clientY);
    const dx = pt.x - CX;
    const dy = pt.y - CY;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    let a = Math.atan2(dy, dx);
    setSunByAngle(a);
  }

  function onPointerUp() { dragging = false; }

  scene.addEventListener('pointerdown', onPointerDown);
  scene.addEventListener('pointermove', onPointerMove);
  scene.addEventListener('pointerup', onPointerUp);
  scene.addEventListener('pointercancel', onPointerUp);
  scene.addEventListener('pointerleave', onPointerUp);

  // 预测题目
  function showPredictPrompt() {
    const p = document.getElementById('prompt');
    document.getElementById('promptTitle').textContent = '猜一猜：太阳放在哪里，影子会消失？';
    const opts = document.getElementById('promptOptions');
    opts.innerHTML = '';
    const options = [
      { text: '太阳在头顶上', say: '头顶上影子最短，但还有一点点。再想一想。', correct: false },
      { text: '太阳在左边或右边', say: '旁边时影子会很长哦。再想一想。', correct: false },
      { text: '太阳跑到地下面', say: '答对啦！太阳下山就没光了，影子也睡觉了。', correct: true }
    ];
    options.forEach(o => {
      const btn = document.createElement('button');
      btn.className = 'prompt-btn';
      btn.textContent = o.text;
      btn.onclick = () => {
        p.classList.remove('show');
        say(o.say);
        if (o.correct) {
          setTimeout(() => say('现在自己拖一拖，看看是不是这样。'), 2600);
          setTimeout(showFinalChallenge, 7000);
        } else {
          setTimeout(() => p.classList.add('show'), 2200);
        }
      };
      opts.appendChild(btn);
    });
    p.classList.add('show');
    say('猜一猜：太阳放在哪里，影子会消失？');
  }

  function showFinalChallenge() {
    if (finalShown) return;
    finalShown = true;
    const p = document.getElementById('prompt');
    document.getElementById('promptTitle').textContent = '新问题：月光很亮的晚上，小人会有影子吗？';
    const opts = document.getElementById('promptOptions');
    opts.innerHTML = '';
    const options = [
      { text: '会，淡淡的影子', say: '对啦！月光也是光，会有很淡很淡的影子。', correct: true },
      { text: '完全不会有', say: '月光也是光哦，只是很淡，会有淡淡的影子。', correct: false },
      { text: '我不知道', say: '没关系，下次有月亮的晚上，自己去看看。', correct: false }
    ];
    options.forEach(o => {
      const btn = document.createElement('button');
      btn.className = 'prompt-btn';
      btn.textContent = o.text;
      btn.onclick = () => {
        p.classList.remove('show');
        say(o.say);
        setTimeout(showEnding, 2600);
      };
      opts.appendChild(btn);
    });
    p.classList.add('show');
    say('新问题：月光很亮的晚上，小人会有影子吗？');
  }

  function showEnding() {
    const p = document.getElementById('prompt');
    document.getElementById('promptTitle').textContent = '你发现了：太阳越高，影子越短；太阳越低，影子越长。';
    const opts = document.getElementById('promptOptions');
    opts.innerHTML = '';
    const btn = document.createElement('button');
    btn.className = 'prompt-btn';
    btn.textContent = '再玩一次';
    btn.onclick = () => {
      p.classList.remove('show');
      sawLong = false;
      sawGone = false;
      promptShown = false;
      finalShown = false;
      lastZone = '';
      document.getElementById('parentZone').hidden = true;
      setSunByAngle(-Math.PI / 2);
      say('再玩一次吧。');
    };
    opts.appendChild(btn);
    p.classList.add('show');
    document.getElementById('parentZone').hidden = false;
    say('你发现了：太阳越高，影子越短；太阳越低，影子越长。');
  }

  // 初始化
  setSunByAngle(-Math.PI / 2);
})();
</script>
</body>
