<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>贪吃蛇</title>
<style>
  :root{
    --bg:#0f1419;
    --surface:#1a2028;
    --surface-2:#222a35;
    --text:#e6edf3;
    --muted:#8b949e;
    --accent:#4ade80;
    --accent-dim:#22c55e;
    --danger:#f87171;
    --border:#2d3748;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100%;overscroll-behavior:none;}
  body{display:flex;flex-direction:column;align-items:center;min-height:100dvh;padding:16px;}

  .app{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px;flex:1;}

  header{text-align:center;padding:8px 0 4px;cursor:pointer;border-radius:10px;
    transition:background 150ms;user-select:none;}
  header:hover{background:var(--surface);}
  header:active{background:var(--surface-2);}
  header h1{margin:0;font-size:24px;font-weight:700;letter-spacing:1px;}
  header .hint{margin:4px 0 0;font-size:12px;color:var(--muted);}
  header .hint .pause-tag{color:var(--accent);font-weight:600;}

  .hud{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:8px 12px;display:flex;flex-direction:column;gap:2px;}
  .stat .label{font-size:11px;color:var(--muted);letter-spacing:.5px;}
  .stat .value{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .stat.best .value{color:var(--accent);}

  .stage{position:relative;display:flex;justify-content:center;}
  canvas{display:block;background:var(--surface);border:1px solid var(--border);
    border-radius:16px;touch-action:none;width:100%;max-width:360px;height:auto;}

  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;text-align:center;
    background:rgba(15,20,25,.82);backdrop-filter:blur(4px);
    border-radius:16px;padding:16px;transition:opacity 180ms;}
  .overlay.hidden{opacity:0;pointer-events:none;}
  .overlay h2{margin:0;font-size:22px;font-weight:700;}
  .overlay p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;}
  .overlay .score-line{font-size:14px;color:var(--text);}
  .overlay .score-line b{color:var(--accent);font-size:18px;
    font-family:ui-monospace,monospace;}

  .btn{appearance:none;border:none;cursor:pointer;font:inherit;font-weight:600;
    background:var(--accent);color:#052e16;padding:12px 28px;border-radius:10px;
    font-size:15px;transition:transform 120ms,filter 150ms,background 150ms;
    min-height:44px;min-width:120px;}
  .btn:hover{filter:brightness(1.08);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn:active{transform:scale(.96);}
  .btn.secondary{background:var(--surface-2);color:var(--text);
    border:1px solid var(--border);}

  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    max-width:240px;margin:0 auto;width:100%;}
  .pad .spacer{visibility:hidden;}
  .pad button{appearance:none;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:20px;
    border-radius:10px;height:56px;cursor:pointer;
    transition:background 150ms,transform 120ms;display:flex;
    align-items:center;justify-content:center;}
  .pad button:hover{background:var(--surface-2);}
  .pad button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .pad button:active{transform:scale(.94);background:var(--surface-2);}

  .help{font-size:12px;color:var(--muted);line-height:1.6;text-align:center;}
  .help kbd{background:var(--surface-2);border:1px solid var(--border);
    border-radius:6px;padding:1px 6px;font-family:ui-monospace,monospace;
    font-size:11px;color:var(--text);}

  footer{margin-top:auto;padding-top:12px;text-align:center;color:var(--muted);
    font-size:11px;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
  @media (hover:none){ .pad{display:grid;} }
</style>
</head>
<body>
  <div class="app">
    <header id="topbar" role="banner" aria-label="点击暂停或继续">
      <h1>贪吃蛇</h1>
      <div class="hint">点击此处 <span class="pause-tag">暂停 / 继续</span></div>
    </header>

    <div class="hud" aria-live="polite">
      <div class="stat">
        <span class="label">本局得分</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="stat best">
        <span class="label">最高分</span>
        <span class="value" id="best">0</span>
      </div>
    </div>

    <div class="stage">
      <canvas id="board" width="300" height="600" aria-label="贪吃蛇游戏画布"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ov-title">准备开始</h2>
        <p id="ov-desc">用方向键或滑动屏幕控制方向，吃到食物得分，别撞墙也别咬到自己。</p>
        <button class="btn" id="start-btn">开始游戏</button>
      </div>
    </div>

    <div class="pad" id="pad">
      <div class="spacer"></div>
      <button data-dir="up" aria-label="向上">▲</button>
      <div class="spacer"></div>
      <button data-dir="left" aria-label="向左">◀</button>
      <button data-dir="down" aria-label="向下">▼</button>
      <button data-dir="right" aria-label="向右">▶</button>
    </div>

    <div class="help">
      键盘：<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> ·
      空格 <kbd>Space</kbd> 暂停 · 顶部标题区也可点击暂停
    </div>

    <footer>数据仅保存在本机浏览器，刷新不丢。</footer>
  </div>

<script>
(function(){
  "use strict";

  // ===== 配置 =====
  const COLS = 10;
  const ROWS = 20;
  const CELL = 30;                // 逻辑格大小
  const BASE_STEP = 180;          // 初始步进 ms
  const MIN_STEP = 75;            // 最快步进 ms
  const SPEED_UP = 4;             // 每吃 1 个食物减少 ms
  const GRACE_MS = 300;           // 开局短暂免死延迟（防误触反向）

  // ===== 元素 =====
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovDesc = document.getElementById('ov-desc');
  const startBtn = document.getElementById('start-btn');
  const topbar = document.getElementById('topbar');
  const pad = document.getElementById('pad');

  // 高分屏缩放
  const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
  canvas.width = COLS * CELL * dpr;
  canvas.height = ROWS * CELL * dpr;
  canvas.style.width = (COLS * CELL) + 'px';
  ctx.scale(dpr, dpr);

  // ===== 状态 =====
  const STATE = { READY:'ready', PLAYING:'playing', PAUSED:'paused', OVER:'over' };
  let state = STATE.READY;
  let snake = [];            // [{x,y}, ...]，头在 [0]
  let dir = {x:1, y:0};
  let pendingDir = dir;
  let food = null;
  let score = 0;
  let best = 0;
  let stepMs = BASE_STEP;
  let acc = 0;               // 累积时间
  let lastTs = 0;
  let rafId = 0;
  let dirLockedUntil = 0;    // 防止同一帧连按两个键反向自杀

  // ===== 本地存储 =====
  const BEST_KEY = 'snake.best.v1';
  function loadBest(){
    try{
      const v = localStorage.getItem(BEST_KEY);
      if(v == null) return 0;
      const n = parseInt(v, 10);
      return Number.isFinite(n) ? n : 0;
    }catch(e){ return 0; }
  }
  function saveBest(v){
    try{ localStorage.setItem(BEST_KEY, String(v)); }catch(e){}
  }
  best = loadBest();
  bestEl.textContent = best;

  // ===== 初始化局 =====
  function resetGame(){
    snake = [
      {x: 4, y: 10},
      {x: 3, y: 10},
      {x: 2, y: 10}
    ];
    dir = {x:1, y:0};
    pendingDir = dir;
    score = 0;
    stepMs = BASE_STEP;
    acc = 0;
    dirLockedUntil = performance.now() + GRACE_MS;
    scoreEl.textContent = '0';
    food = spawnFood();
  }

  function spawnFood(){
    const occupied = new Set(snake.map(s => s.x + ',' + s.y));
    const empty = [];
    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        if(!occupied.has(x+','+y)) empty.push({x,y});
      }
    }
    if(empty.length === 0) return null;
    return empty[Math.floor(Math.random()*empty.length)];
  }

  // ===== 渲染 =====
  function drawBoard(){
    // 背景
    ctx.fillStyle = getCss('--surface');
    roundRect(ctx, 0, 0, COLS*CELL, ROWS*CELL, 0);
    ctx.fill();

    // 网格淡线
    ctx.strokeStyle = getCss('--border');
    ctx.lineWidth = 1;
    for(let x=1;x<COLS;x++){
      ctx.beginPath();
      ctx.moveTo(x*CELL+0.5, 0);
      ctx.lineTo(x*CELL+0.5, ROWS*CELL);
      ctx.stroke();
    }
    for(let y=1;y<ROWS;y++){
      ctx.beginPath();
      ctx.moveTo(0, y*CELL+0.5);
      ctx.lineTo(COLS*CELL, y*CELL+0.5);
      ctx.stroke();
    }

    // 食物
    if(food){
      const cx = food.x*CELL + CELL/2;
      const cy = food.y*CELL + CELL/2;
      ctx.fillStyle = getCss('--accent');
      ctx.beginPath();
      ctx.arc(cx, cy, CELL*0.30, 0, Math.PI*2);
      ctx.fill();
      // 高光
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath();
      ctx.arc(cx-CELL*0.08, cy-CELL*0.08, CELL*0.08, 0, Math.PI*2);
      ctx.fill();
    }

    // 蛇
    for(let i=snake.length-1; i>=0; i--){
      const seg = snake[i];
      const isHead = i === 0;
      const px = seg.x*CELL + 1;
      const py = seg.y*CELL + 1;
      const sz = CELL - 2;
      if(isHead){
        ctx.fillStyle = getCss('--accent');
      }else{
        // 渐变尾部稍暗
        const t = i / Math.max(1, snake.length);
        ctx.fillStyle = mixColor(getCss('--accent'), getCss('--surface-2'), t*0.55);
      }
      roundRect(ctx, px, py, sz, sz, isHead?8:6);
      ctx.fill();

      // 头部眼睛
      if(isHead){
        ctx.fillStyle = '#052e16';
        const ex = seg.x*CELL + CELL/2 + dir.x*CELL*0.18;
        const ey = seg.y*CELL + CELL/2 + dir.y*CELL*0.18;
        ctx.beginPath();
        ctx.arc(ex, ey, 2.2, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }

  function roundRect(c,x,y,w,h,r){
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }

  // 读取 CSS 变量颜色
  const cssColors = {};
  function getCss(name){
    if(cssColors[name]) return cssColors[name];
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    cssColors[name] = v;
    return v;
  }
  // 简单十六进制颜色混合
  function mixColor(a,b,t){
    const pa = parseHex(a), pb = parseHex(b);
    if(!pa||!pb) return a;
    const r = Math.round(pa[0]*(1-t)+pb[0]*t);
    const g = Math.round(pa[1]*(1-t)+pb[1]*t);
    const bl= Math.round(pa[2]*(1-t)+pb[2]*t);
    return 'rgb('+r+','+g+','+bl+')';
  }
  function parseHex(h){
    h = h.replace('#','');
    if(h.length===3) h = h.split('').map(c=>c+c).join('');
    if(h.length!==6) return null;
    return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
  }

  // ===== 步进 =====
  function step(){
    // 应用待定方向
    if(performance.now() >= dirLockedUntil){
      // 不允许直接反向
      if(!(pendingDir.x === -dir.x && pendingDir.y === -dir.y)){
        dir = pendingDir;
      }
    }

    const head = snake[0];
    const nx = head.x + dir.x;
    const ny = head.y + dir.y;

    // 撞墙
    if(nx<0 || nx>=COLS || ny<0 || ny>=ROWS){
      return gameOver();
    }
    // 撞自己（不含即将被移除的尾巴，除非吃食物）
    const willEat = food && nx===food.x && ny===food.y;
    const bodyEnd = willEat ? snake.length : snake.length-1;
    for(let i=0;i<bodyEnd;i++){
      if(snake[i].x===nx && snake[i].y===ny){
        return gameOver();
      }
    }

    snake.unshift({x:nx, y:ny});
    if(willEat){
      score += 1;
      scoreEl.textContent = String(score);
      stepMs = Math.max(MIN_STEP, BASE_STEP - score*SPEED_UP);
      food = spawnFood();
      if(!food) return gameOver(true); // 满图胜利
    }else{
      snake.pop();
    }
  }

  // ===== 主循环 =====
  function loop(ts){
    if(state !== STATE.PLAYING) return;
    if(!lastTs) lastTs = ts;
    const dt = Math.min(100, ts - lastTs); // 防止页面切走后跳变
    lastTs = ts;
    acc += dt;
    while(acc >= stepMs){
      acc -= stepMs;
      step();
      if(state !== STATE.PLAYING) break;
    }
    drawBoard();
    rafId = requestAnimationFrame(loop);
  }

  function startLoop(){
    cancelAnimationFrame(rafId);
    lastTs = 0;
    acc = 0;
    rafId = requestAnimationFrame(loop);
  }
  function stopLoop(){
    cancelAnimationFrame(rafId);
  }

  // ===== 状态切换 =====
  function setOverlay(show, title, desc, btnText){
    if(show){
      overlay.classList.remove('hidden');
      ovTitle.textContent = title || '';
      ovDesc.innerHTML = desc || '';
      if(btnText){ startBtn.textContent = btnText; startBtn.style.display=''; }
      else { startBtn.style.display='none'; }
    }else{
      overlay.classList.add('hidden');
    }
  }

  function toReady(){
    state = STATE.READY;
    stopLoop();
    resetGame();
    drawBoard();
    setOverlay(true, '准备开始',
      '用方向键或滑动屏幕控制方向，吃到食物得分，别撞墙也别咬到自己。',
      '开始游戏');
  }
  function toPlaying(){
    if(state === STATE.READY || state === STATE.OVER){
      resetGame();
    }
    state = STATE.PLAYING;
    setOverlay(false);
    startLoop();
  }
  function toPaused(){
    if(state !== STATE.PLAYING) return;
    state = STATE.PAUSED;
    stopLoop();
    setOverlay(true, '已暂停',
      '点击「继续」或顶部标题区、按空格恢复游戏。',
      '继续');
  }
  function toResumed(){
    if(state !== STATE.PAUSED) return;
    state = STATE.PLAYING;
    setOverlay(false);
    startLoop();
  }
  function gameOver(won){
    state = STATE.OVER;
    stopLoop();
    if(score > best){
      best = score;
      bestEl.textContent = String(best);
      saveBest(best);
    }
    if(won){
      setOverlay(true, '通关！',
        '本局得分 <b>'+score+'</b><br>你填满了整个棋盘，太强了。',
        '再来一局');
    }else{
      setOverlay(true, '游戏结束',
        '本局得分 <b>'+score+'</b>　最高分 <b>'+best+'</b>',
        '再来一局');
    }
  }

  // ===== 输入 =====
  function setDir(nx, ny){
    if(state !== STATE.PLAYING) return;
    // 不允许直接反向（基于当前实际方向）
    if(nx === -dir.x && ny === -dir.y) return;
    pendingDir = {x:nx, y:ny};
    dirLockedUntil = 0; // 一旦设置新方向，解锁
  }

  document.addEventListener('keydown', (e)=>{
    const k = e.key;
    let handled = true;
    switch(k){
      case 'ArrowUp': case 'w': case 'W': setDir(0,-1); break;
      case 'ArrowDown': case 's': case 'S': setDir(0,1); break;
      case 'ArrowLeft': case 'a': case 'A': setDir(-1,0); break;
      case 'ArrowRight': case 'd': case 'D': setDir(1,0); break;
      case ' ':
        togglePause();
        break;
      case 'Enter':
        if(state === STATE.READY || state === STATE.OVER) toPlaying();
        else if(state === STATE.PAUSED) toResumed();
        else handled = false;
        break;
      default: handled = false;
    }
    if(handled) e.preventDefault();
  }, {passive:false});

  function togglePause(){
    if(state === STATE.PLAYING) toPaused();
    else if(state === STATE.PAUSED) toResumed();
  }

  // 顶部点击：暂停/继续
  topbar.addEventListener('click', togglePause);

  // 开始按钮
  startBtn.addEventListener('click', ()=>{
    if(state === STATE.PAUSED) toResumed();
    else toPlaying();
  });

  // 触屏方向按钮
  pad.addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-dir]');
    if(!btn) return;
    const d = btn.dataset.dir;
    if(d==='up') setDir(0,-1);
    else if(d==='down') setDir(0,1);
    else if(d==='left') setDir(-1,0);
    else if(d==='right') setDir(1,0);
  });

  // 画布滑动
  let touchStart = null;
  canvas.addEventListener('touchstart', (e)=>{
    if(e.touches.length>0){
      touchStart = {x:e.touches[0].clientX, y:e.touches[0].clientY, t:performance.now()};
    }
  }, {passive:true});
  canvas.addEventListener('touchmove', (e)=>{
    if(!touchStart || e.touches.length===0) return;
    const dx = e.touches[0].clientX - touchStart.x;
    const dy = e.touches[0].clientY - touchStart.y;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if(Math.max(adx,ady) < 20) return;
    if(adx > ady){
      setDir(dx>0?1:-1, 0);
    }else{
      setDir(0, dy>0?1:-1);
    }
    touchStart = {x:e.touches[0].clientX, y:e.touches[0].clientY, t:performance.now()};
  }, {passive:true});
  canvas.addEventListener('touchend', ()=>{ touchStart=null; }, {passive:true});

  // 画布点击：在空白（顶部棋盘外）实际归到 topbar；
  // 在棋盘上点击也可作为暂停快捷方式（便于触屏）
  canvas.addEventListener('click', ()=>{
    if(state === STATE.PLAYING) toPaused();
    else if(state === STATE.PAUSED) toResumed();
  });

  // 页面失焦自动暂停
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden && state === STATE.PLAYING) toPaused();
  });

  // 启动
  toReady();
})();
</script>
</body>
</html>
