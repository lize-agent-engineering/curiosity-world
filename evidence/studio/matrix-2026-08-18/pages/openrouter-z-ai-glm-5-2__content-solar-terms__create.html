<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二十四节气图鉴</title>
<style>
:root{
  --bg:#f0e9dc;
  --surface:#faf6ee;
  --surface-2:#f4ecdd;
  --text:#3a322a;
  --muted:#7a6f60;
  --accent:#8a6a3a;
  --border:#e0d4bf;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.05);
}
body[data-season="春"]{
  --bg:#e8f5e1; --surface:#f7fbf3; --surface-2:#eaf3e3;
  --text:#2d3b28; --muted:#5e7355; --accent:#4a8a3a; --border:#d4e3c8;
}
body[data-season="夏"]{
  --bg:#d7eef5; --surface:#ecf7fc; --surface-2:#dfeaf0;
  --text:#1e3a4a; --muted:#51707d; --accent:#2a6b95; --border:#c3d9e6;
}
body[data-season="秋"]{
  --bg:#f5e6cf; --surface:#fbf2e3; --surface-2:#efe2cb;
  --text:#4a3018; --muted:#85694a; --accent:#b06820; --border:#e6d2b0;
}
body[data-season="冬"]{
  --bg:#eef2f5; --surface:#f7f9fb; --surface-2:#e4eaef;
  --text:#2a3540; --muted:#6a7787; --accent:#5a7090; --border:#d4dde5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
  min-height:100vh;
  transition:background-color 400ms ease, color 400ms ease;
}
.wrap{max-width:1100px;margin:0 auto;padding:32px 20px 64px}
header{margin-bottom:24px}
h1{font-size:clamp(28px,5vw,40px);font-weight:700;letter-spacing:.04em;margin:0 0 8px}
.subtitle{color:var(--muted);font-size:16px;margin:0}
.filters{
  display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 28px;
}
.tab{
  font-family:inherit;font-size:15px;
  padding:10px 22px;border-radius:16px;
  border:1.5px solid var(--border);
  background:transparent;color:var(--text);
  cursor:pointer;min-height:44px;
  transition:background-color 180ms ease,color 180ms ease,border-color 180ms ease,transform 120ms ease;
}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab:active{transform:translateY(1px)}
.tab.active{
  background:var(--accent);color:#fff;border-color:var(--accent);
}
.tab.active:hover{color:#fff}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:16px;
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  cursor:pointer;
  box-shadow:var(--shadow);
  transition:transform 180ms ease,box-shadow 180ms ease,border-color 180ms ease;
  display:flex;flex-direction:column;gap:8px;
  text-align:left;
  font-family:inherit;color:inherit;
}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.08);border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card .swatch{
  height:8px;border-radius:6px;background:var(--term-color);margin-bottom:6px;
}
.card .name{font-size:24px;font-weight:700;letter-spacing:.06em}
.card .date{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .brief{font-size:15px;color:var(--text);opacity:.85}
@keyframes flashBorder{
  0%,100%{box-shadow:0 0 0 0 var(--accent), var(--shadow)}
  50%{box-shadow:0 0 0 4px var(--accent), var(--shadow)}
}
.card.flash{animation:flashBorder 0.5s ease 4;border-color:var(--accent)}

.empty{padding:48px 0;text-align:center;color:var(--muted);font-size:15px}

footer{
  margin-top:48px;padding-top:24px;border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:16px;align-items:flex-start;
}
footer p{margin:0;color:var(--muted);font-size:14px;max-width:34em}
.btn-primary{
  font-family:inherit;font-size:15px;
  padding:12px 24px;border-radius:16px;
  background:var(--accent);color:#fff;border:none;cursor:pointer;
  min-height:44px;
  transition:transform 120ms ease,opacity 180ms ease,filter 180ms ease;
}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn-primary:active{transform:translateY(1px)}

/* Modal */
.overlay{
  position:fixed;inset:0;background:rgba(20,18,14,.45);
  display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:50;
  opacity:0;pointer-events:none;
  transition:opacity 200ms ease;
}
.overlay.open{opacity:1;pointer-events:auto}
.modal{
  background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:16px;
  max-width:560px;width:100%;max-height:84vh;overflow-y:auto;
  padding:28px;box-shadow:0 12px 40px rgba(0,0,0,.2);
  transform:translateY(12px) scale(.98);
  transition:transform 200ms ease;
}
.overlay.open .modal{transform:translateY(0) scale(1)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:4px}
.modal-title{font-size:28px;font-weight:700;letter-spacing:.06em;margin:0}
.modal-meta{font-size:13px;color:var(--muted);margin:4px 0 20px;font-variant-numeric:tabular-nums}
.close-btn{
  font-family:inherit;font-size:18px;width:36px;height:36px;
  border-radius:10px;border:1px solid var(--border);
  background:transparent;color:var(--text);cursor:pointer;
  flex-shrink:0;
  transition:background-color 180ms ease;
}
.close-btn:hover{background:var(--surface-2);color:var(--accent)}
.close-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.section{margin:20px 0}
.section h3{
  font-size:15px;font-weight:600;color:var(--accent);
  margin:0 0 10px;letter-spacing:.08em;
  display:flex;align-items:center;gap:8px;
}
.section h3::before{content:"";width:14px;height:2px;background:var(--accent);border-radius:2px}
.section ul{margin:0;padding-left:22px}
.section li{margin:4px 0;font-size:15px}
.poem{
  background:var(--surface-2);border-left:3px solid var(--accent);
  padding:12px 16px;border-radius:0 10px 10px 0;
  font-size:15px;line-height:1.9;
}
.poem .poem-title{font-weight:600;margin-bottom:6px;font-size:14px;color:var(--muted)}
.poem .poem-line{display:block}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
@media (max-width:600px){
  .wrap{padding:20px 14px 48px}
  .grid{grid-template-columns:1fr 1fr;gap:12px}
  .card{padding:14px}
  .card .name{font-size:20px}
  .modal{padding:22px}
}
</style>
</head>
<body data-season="全部">
<div class="wrap">
  <header>
    <h1>二十四节气图鉴</h1>
    <p class="subtitle">一年有四时，四时各六气。点开任一节气，看看古人如何记录光阴。</p>
    <nav class="filters" aria-label="季节筛选">
      <button class="tab active" data-filter="全部" type="button">全部</button>
      <button class="tab" data-filter="春" type="button">春</button>
      <button class="tab" data-filter="夏" type="button">夏</button>
      <button class="tab" data-filter="秋" type="button">秋</button>
      <button class="tab" data-filter="冬" type="button">冬</button>
    </nav>
  </header>

  <main id="grid" class="grid" aria-live="polite"></main>

  <footer>
    <p>节气数据依现行公历日期与太阳黄经标注。物候取自《月令七十二候集解》，习俗为各地常见做法。</p>
    <button class="btn-primary" id="locateBtn" type="button">定位当前节气</button>
  </footer>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div>
        <h2 class="modal-title" id="modalTitle"></h2>
        <p class="modal-meta" id="modalMeta"></p>
      </div>
      <button class="close-btn" id="closeBtn" type="button" aria-label="关闭详情">×</button>
    </div>
    <div class="section">
      <h3>物候</h3>
      <ul id="phenology"></ul>
    </div>
    <div class="section">
      <h3>习俗</h3>
      <ul id="customs"></ul>
    </div>
    <div class="section">
      <h3>相关诗词</h3>
      <div class="poem" id="poem"></div>
    </div>
  </div>
</div>

<script>

const grid = document.getElementById('grid');
const tabs = document.querySelectorAll('.tab');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
const closeBtn = document.getElementById('closeBtn');
let currentFilter = '全部';

function renderGrid(filter){
  const list = filter === '全部' ? TERMS : TERMS.filter(t=>t.season===filter);
  if(list.length === 0){
    grid.innerHTML = '<div class="empty">这个季节暂无节气数据。</div>';
    return;
  }
  grid.innerHTML = list.map(t=>`
    <button class="card" data-name="${t.name}" type="button" style="--term-color:${t.color}">
      <span class="swatch" aria-hidden="true"></span>
      <span class="name">${t.name}</span>
      <span class="date">${t.date} · 黄经 ${t.longitude}</span>
      <span class="brief">${t.brief}</span>
    </button>
  `).join('');
  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click',()=>openModal(card.dataset.name));
  });
}

function setFilter(filter){
  currentFilter = filter;
  tabs.forEach(t=>t.classList.toggle('active', t.dataset.filter===filter));
  const season = filter === '全部' ? '全部' : filter;
  document.body.dataset.season = season;
  renderGrid(filter);
}

tabs.forEach(t=>{
  t.addEventListener('click',()=>setFilter(t.dataset.filter));
});

function openModal(name){
  const term = TERMS.find(t=>t.name===name);
  if(!term) return;
  document.getElementById('modalTitle').textContent = term.name;
  document.getElementById('modalMeta').textContent = `公历 ${term.date} · 太阳黄经 ${term.longitude} · ${term.season}季`;
  document.getElementById('phenology').innerHTML = term.phenology.map(p=>`<li>${p}</li>`).join('');
  document.getElementById('customs').innerHTML = term.customs.map(c=>`<li>${c}</li>`).join('');
  document.getElementById('poem').innerHTML = `
    <div class="poem-title">${term.poem.title}</div>
    ${term.poem.lines.map(l=>`<span class="poem-line">${l}</span>`).join('')}
  `;
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden','false');
  closeBtn.focus();
}
function closeModal(){
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden','true');
}
closeBtn.addEventListener('click',closeModal);
overlay.addEventListener('click',e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && overlay.classList.contains('open')) closeModal(); });

function findCurrentTerm(){
  const now = new Date();
  const m = now.getMonth()+1, d = now.getDate();
  const tnum = m*100 + d;
  const sorted = [...TERMS].sort((a,b)=> (a.start[0]*100+a.start[1]) - (b.start[0]*100+b.start[1]));
  let current = sorted[sorted.length-1];
  for(const t of sorted){
    const n = t.start[0]*100 + t.start[1];
    if(n <= tnum) current = t; else break;
  }
  return current;
}

document.getElementById('locateBtn').addEventListener('click',()=>{
  const cur = findCurrentTerm();
  if(!cur) return;
  setFilter(cur.season);
  // 等待重新渲染
  requestAnimationFrame(()=>{
    const target = grid.querySelector(`.card[data-name="${cur.name}"]`);
    if(!target) return;
    target.scrollIntoView({behavior:'smooth', block:'center'});
    target.classList.add('flash');
    setTimeout(()=>target.classList.remove('flash'),2100);
    setTimeout(()=>target.focus(),400);
  });
});

// 初始化
renderGrid('全部');
</script>
