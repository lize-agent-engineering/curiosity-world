<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>二十四节气图鉴</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #151b2b;
      --surface-2: #1e2636;
      --text: #f2f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --border: #2a3447;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --radius: 16px;
      --radius-sm: 10px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: linear-gradient(180deg, rgba(11,15,25,0.95) 0%, rgba(11,15,25,0.85) 100%);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
    }
    .title {
      margin: 0 0 12px;
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .filter-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .filter-btn.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 600;
    }

    /* Main content */
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      min-height: calc(100vh - 200px);
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }
    @media (max-width: 1024px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; gap: 16px; } }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(600px circle at var(--x,50%) var(--y,50%), rgba(56,189,248,0.12), transparent 40%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: rgba(56,189,248,0.3); }
    .card:hover::before { opacity: 1; }
    .card-icon {
      width: 80px;
      height: 80px;
      margin-bottom: 12px;
      color: var(--accent);
      transition: transform 0.3s ease;
    }
    .card:hover .card-icon { transform: scale(1.1); }
    .card-icon svg { width: 100%; height: 100%; display: block; }
    .card-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .card-big-char {
      font-size: 48px;
      font-weight: 800;
      line-height: 1;
      margin: 8px 0;
      background: linear-gradient(135deg, var(--text) 0%, var(--muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.9;
    }
    .card-date {
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 8px;
      font-weight: 500;
    }
    .card-desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 64px 24px;
      color: var(--muted);
      font-size: 16px;
      grid-column: 1 / -1;
    }

    /* Detail Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-backdrop.active { opacity: 1; visibility: visible; }
    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 720px;
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      transform: scale(0.96);
      transition: transform 0.3s ease;
    }
    .modal-backdrop.active .modal-card { transform: scale(1); }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }
    .modal-title {
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .season-tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(56,189,248,0.15);
      color: var(--accent);
      border: 1px solid rgba(56,189,248,0.3);
      font-weight: 600;
    }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .modal-close:hover { background: rgba(255,255,255,0.08); color: var(--text); }
    .modal-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .modal-body {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
    }
    .modal-body::-webkit-scrollbar { width: 8px; }
    .modal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .modal-section { margin-bottom: 24px; }
    .modal-section:last-child { margin-bottom: 0; }
    .modal-section-title {
      font-size: 14px;
      color: var(--accent);
      margin: 0 0 8px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .modal-text {
      font-size: 16px;
      line-height: 1.7;
      color: var(--text);
      margin: 0;
    }
    .modal-list {
      margin: 0;
      padding-left: 20px;
      color: var(--text);
    }
    .modal-list li { margin-bottom: 6px; line-height: 1.6; }
    .poem {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--surface-2);
      padding: 16px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--accent);
      font-size: 15px;
      color: var(--text);
      margin: 0;
      line-height: 1.8;
    }
    .modal-nav {
      display: flex;
      gap: 12px;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface-2);
    }
    .nav-btn {
      flex: 1;
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 12px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
    }
    .nav-btn:hover { background: rgba(56,189,248,0.1); border-color: var(--accent); }
    .nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .nav-btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
    .nav-btn-primary:hover { background: #7dd3fc; }

    /* Content switch animation */
    .content-fade { transition: opacity 0.2s ease; }
    .content-fade.switching { opacity: 0.5; }

    /* Footer proverb */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(0deg, rgba(11,15,25,0.95) 0%, rgba(11,15,25,0.7) 100%);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      z-index: 40;
    }
    .proverb-text { font-style: italic; }
    .visit-info {
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      color: var(--muted);
      opacity: 0.8;
    }
    @media (max-width: 640px) {
      .footer { padding: 12px 16px; font-size: 13px; }
      .visit-info { position: static; display: block; margin-top: 4px; transform: none; }
    }

    body.modal-open { overflow: hidden; }
  </style>
</head>

        <div class="modal-section">

          <p class="poem" id="modal-poem"></p>

      </div>
      <div class="modal-nav">
        <button class="nav-btn" id="btn-prev">← 上一个</button>
        <button class="nav-btn nav-btn-primary" id="btn-next">下一个 →</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="proverb-text" id="proverb">正在加载谚语...</div>
    <div class="visit-info" id="visit-info"></div>
  </footer>

    const proverbs = [
      '立春雨水到，早起晚睡觉。',
      '春分秋分，昼夜平分。',
      '清明前后，种瓜点豆。',
      '谷雨麦挑旗，立夏麦头齐。',
      '小满不满，芒种不管。',
      '夏至不过不暖，冬至不过不寒。',
      '小暑大暑，上蒸下煮。',
      '立秋一场雨，夏衣高捆起。',
      '白露白茫茫，谷子满田黄。',
      '寒露种麦正当时，霜降种麦莫迟疑。',
      '立冬补冬，补嘴空。',
      '大雪小雪，煮饭不息。',
      '冬至大如年，人间小团圆。',
      '小寒大寒，杀猪过年。',
      '春雨惊春清谷天，夏满芒夏暑相连。',
      '秋处露秋寒霜降，冬雪雪冬小大寒。'
    ];

    const seasonMap = {
      'spring': '春',
      'summer': '夏',
      'autumn': '秋',
      'winter': '冬'
    };

    const state = {
      currentSeason: null,
      currentDetailIndex: 0,
      filteredTerms: []
    };

    // LocalStorage operations
    function getStorage(key, defaultVal) {
      try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : defaultVal;
      } catch {
        return defaultVal;
      }
    }
    function setStorage(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    }

    // Initialize visit count
    let visitCount = parseInt(getStorage('visitCount', 0));
    visitCount++;
    setStorage('visitCount', visitCount);
    const lastViewed = getStorage('lastViewedTerm', null);
    document.getElementById('visit-info').textContent = 
      `访问次数：${visitCount}${lastViewed ? ' · 上次浏览：' + lastViewed : ''}`;

    // URL hash handling
    function parseHash() {
      const hash = location.hash;
      const match = hash.match(/season=([\u4e00-\u9fa5])/);
      if (match) {
        const seasonChar = match[1];
        const entry = Object.entries(seasonMap).find(([k,v]) => v === seasonChar);
        return entry ? entry[0] : null;
      }
      return null;
    }

    function updateHash(season) {
      if (season) {
        const char = seasonMap[season];
        location.hash = `#/season=${char}`;
      } else {
        history.pushState('', document.title, window.location.pathname + window.location.search);
      }
    }

    // Render cards
    function renderCards() {
      const grid = document.getElementById('card-grid');
      const empty = document.getElementById('empty-state');
      
      let terms = solarTerms;
      if (state.currentSeason) {
        terms = solarTerms.filter(t => t.season === state.currentSeason);
      }
      state.filteredTerms = terms;

      if (terms.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      grid.innerHTML = terms.map((term, idx) => `
        <article class="card" onclick="openDetail(${idx})" role="listitem" tabindex="0" 
                 onkeydown="if(event.key==='Enter')openDetail(${idx})"
                 aria-label="${term.name}，${term.dateRange}">
          <div class="card-icon" aria-hidden="true">${term.icon}</div>
          <div class="card-title">${term.name}</div>
          <div class="card-big-char" aria-hidden="true">${term.bigChar}</div>
          <div class="card-date">${term.dateRange}</div>
          <div class="card-desc">${term.description}</div>
        </article>
      `).join('');

      // Add mouse move effect for cards
      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          card.style.setProperty('--x', x + 'px');
          card.style.setProperty('--y', y + 'px');
        });
      });
    }

    // Update filter buttons UI
    function updateFilterButtons() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        const season = btn.dataset.season;
        if (season === state.currentSeason) {
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
        } else {
          btn.classList.remove('active');
          btn.setAttribute('aria-selected', 'false');
        }
      });
    }

    // Filter logic
    function setFilter(season) {
      if (state.currentSeason === season) {
        state.currentSeason = null;
        updateHash(null);
      } else {
        state.currentSeason = season;
        updateHash(season);
      }
      updateFilterButtons();
      renderCards();
      updateRandomProverb();
    }

    // Proverb
    function updateRandomProverb() {
      const idx = Math.floor(Math.random() * proverbs.length);
      document.getElementById('proverb').textContent = proverbs[idx];
    }

    // Detail modal
    const modal = document.getElementById('detail-modal');
    const modalBody = document.getElementById('modal-body');

    function openDetail(index) {
      state.currentDetailIndex = index;
      renderDetail();
      modal.classList.add('active');
      document.body.classList.add('modal-open');
      
      const term = state.filteredTerms[index];
      if (term) setStorage('lastViewedTerm', term.name);
    }

    function closeDetail() {
      modal.classList.remove('active');
      document.body.classList.remove('modal-open');
    }

    function renderDetail() {
      const term = state.filteredTerms[state.currentDetailIndex];
      if (!term) return;

      document.getElementById('modal-term-name').textContent = term.name;
      document.getElementById('modal-season-tag').textContent = term.seasonName;
      document.getElementById('modal-date').textContent = term.dateRange;
      document.getElementById('modal-sanhou').innerHTML = term.sanhou.map(s => `<li>${s}</li>`).join('');
      document.getElementById('modal-customs').textContent = term.customs;
      document.getElementById('modal-health').textContent = term.health;
      document.getElementById('modal-poem').textContent = term.poem;
    }

    function switchDetail(direction) {
      // direction: -1 for prev, 1 for next
      modalBody.classList.add('switching');
      setTimeout(() => {
        const len = state.filteredTerms.length;
        state.currentDetailIndex = (state.currentDetailIndex + direction + len) % len;
        renderDetail();
        modalBody.classList.remove('switching');
      }, 150);
    }

    // Event listeners
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => setFilter(btn.dataset.season));
    });

    document.getElementById('modal-close').addEventListener('click', closeDetail);
    document.getElementById('btn-prev').addEventListener('click', () => switchDetail(-1));
    document.getElementById('btn-next').addEventListener('click', () => switchDetail(1));

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeDetail();
    });

    document.addEventListener('keydown', (e) => {
      if (!modal.classList.contains('active')) return;
      if (e.key === 'Escape') closeDetail();
      if (e.key === 'ArrowLeft') switchDetail(-1);
      if (e.key === 'ArrowRight') switchDetail(1);
    });

    window.addEventListener('hashchange', () => {
      state.currentSeason = parseHash();
      updateFilterButtons();
      renderCards();
    });

    // Init
    state.currentSeason = parseHash();
    updateFilterButtons();
    renderCards();
    updateRandomProverb();
  </script>
