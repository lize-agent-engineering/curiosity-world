<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>活动报名登记单</title>
<style>
  :root{
    --bg:#0F1419;
    --surface:#1A2028;
    --surface-2:#222B36;
    --text:#E8ECF1;
    --muted:#8B95A5;
    --accent:#2D6CDF;
    --accent-hover:#1E5BB8;
    --border:#2A323D;
    --border-focus:#2D6CDF;
    --danger:#E0584F;
    --success:#4CAF82;
    --radius:10px;
    --radius-lg:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.5;
    min-height:100vh;
    padding:24px 16px 64px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .wrap{
    width:100%;
    max-width:480px;
  }
  header.app-header{
    margin-bottom:20px;
  }
  .app-title{
    font-size:clamp(22px,6vw,28px);
    font-weight:700;
    margin:0 0 6px;
    letter-spacing:.5px;
  }
  .app-desc{
    color:var(--muted);
    font-size:14px;
    margin:0;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:24px;
    box-shadow:0 6px 24px rgba(0,0,0,.18);
  }
  .section-title{
    font-size:16px;
    font-weight:600;
    margin:0 0 18px;
    padding-bottom:12px;
    border-bottom:1px solid var(--border);
  }
  /* form */
  .field{margin-bottom:20px}
  .field:last-child{margin-bottom:0}
  .label-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:8px;
  }
  label.field-label{
    font-size:14px;
    font-weight:600;
    color:var(--text);
  }
  .required{color:var(--accent);font-size:12px}
  .optional{color:var(--muted);font-size:12px}
  .field-hint{
    font-size:12px;
    color:var(--muted);
    margin:0 0 8px;
  }
  .input,.textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--text);
    font-size:15px;
    padding:12px 14px;
    font-family:inherit;
    transition:border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    -webkit-appearance:none;
    appearance:none;
  }
  .textarea{min-height:84px;resize:vertical;line-height:1.5}
  .input::placeholder,.textarea::placeholder{color:#5F6B7A}
  .input:hover,.textarea:hover{border-color:#3A4452}
  .input:focus,.textarea:focus{
    outline:none;
    border-color:var(--border-focus);
    box-shadow:0 0 0 3px rgba(45,108,223,.22);
  }
  .input[readonly]{background:#161C24;color:var(--muted);cursor:pointer}
  .input[readonly]:focus{box-shadow:0 0 0 3px rgba(45,108,223,.18)}
  .input.is-error,.textarea.is-error{border-color:var(--danger)}
  .input.is-error:focus,.textarea.is-error:focus{box-shadow:0 0 0 3px rgba(224,88,79,.22)}
  .error-msg{
    color:var(--danger);
    font-size:12px;
    margin-top:6px;
    min-height:0;
    display:none;
  }
  .error-msg.show{display:block}
  /* radio list */
  .radio-list{display:flex;flex-direction:column;gap:10px}
  .radio-item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:12px 14px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    cursor:pointer;
    background:var(--surface-2);
    transition:border-color 160ms ease, background 160ms ease;
    min-height:44px;
  }
  .radio-item:hover{border-color:#3A4452}
  .radio-item input{position:absolute;opacity:0;pointer-events:none}
  .radio-dot{
    flex:0 0 18px;
    width:18px;height:18px;
    border-radius:50%;
    border:2px solid var(--border);
    background:transparent;
    margin-top:2px;
    transition:all 160ms ease;
    display:flex;align-items:center;justify-content:center;
  }
  .radio-item input:checked ~ .radio-dot{
    border-color:var(--accent);
    background:var(--accent);
  }
  .radio-item input:checked ~ .radio-dot::after{
    content:"";
    width:6px;height:6px;border-radius:50%;background:#fff;
  }
  .radio-item input:focus-visible ~ .radio-dot{
    box-shadow:0 0 0 3px rgba(45,108,223,.3);
  }
  .radio-item:has(input:checked){border-color:var(--accent);background:#16223A}
  .radio-text{display:flex;flex-direction:column;gap:2px}
  .radio-name{font-size:14px;font-weight:600;color:var(--text)}
  .radio-time{font-size:12px;color:var(--muted)}
  /* buttons */
  .actions{display:flex;gap:12px;margin-top:24px}
  .btn{
    flex:1;
    min-height:44px;
    border:none;
    border-radius:var(--radius);
    font-size:15px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    transition:background 160ms ease, transform 80ms ease, box-shadow 160ms ease;
    padding:0 16px;
  }
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-primary:active{transform:translateY(1px)}
  .btn-primary:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(45,108,223,.4)}
  .btn-primary:disabled{
    background:#2A323D;color:#5F6B7A;cursor:not-allowed;
  }
  .btn-ghost{
    background:transparent;
    color:var(--text);
    border:1px solid var(--border);
  }
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn-ghost:active{transform:translateY(1px)}
  .btn-ghost:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(45,108,223,.3)}
  .submit-hint{
    font-size:12px;color:var(--muted);margin-top:10px;text-align:center;
  }
  /* confirm */
  .confirm-list{display:flex;flex-direction:column;gap:0}
  .confirm-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    padding:12px 0;
    border-bottom:1px dashed var(--border);
  }
  .confirm-row:last-child{border-bottom:none}
  .confirm-label{color:var(--muted);font-size:13px;flex:0 0 96px}
  .confirm-value{color:var(--text);font-size:14px;font-weight:500;text-align:right;word-break:break-all;flex:1}
  .confirm-badge{
    display:inline-block;
    padding:2px 10px;
    border-radius:999px;
    background:rgba(45,108,223,.16);
    color:#7FA6F0;
    font-size:12px;
    font-weight:600;
  }
  .success-banner{
    background:rgba(76,175,130,.12);
    border:1px solid rgba(76,175,130,.4);
    color:#9BD9B8;
    border-radius:var(--radius);
    padding:10px 14px;
    font-size:13px;
    margin-bottom:18px;
    display:flex;align-items:center;gap:8px;
  }
  .timestamp{color:var(--muted);font-size:12px;margin-top:14px;text-align:center}
  /* toast */
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
    background:#222B36;color:var(--text);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:10px 16px;font-size:13px;
    opacity:0;pointer-events:none;
    transition:opacity 160ms ease, transform 160ms ease;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  footer.app-footer{
    margin-top:24px;
    color:var(--muted);
    font-size:12px;
    text-align:center;
  }
  .hidden{display:none!important}
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important}
  }
  @media (max-width:380px){
    .card{padding:18px}
    .confirm-label{flex:0 0 80px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <h1 class="app-title">活动报名登记单</h1>
      <p class="app-desc">填写报名信息后提交，系统将生成本次报名确认卡。数据保存在本机，刷新不丢失。</p>
    </header>

    <!-- 表单区 -->
    <section class="card" id="formSection" aria-label="报名表单">
      <h2 class="section-title">填写报名信息</h2>
      <form id="regForm" novalidate>
        <div class="field">
          <div class="label-row">
            <label class="field-label" for="name">姓名</label>
            <span class="required">必填</span>
          </div>
          <p class="field-hint">请填写真实姓名，不少于 2 个字符。</p>
          <input class="input" id="name" name="name" type="text" autocomplete="name" placeholder="如：张三" maxlength="20" />
          <div class="error-msg" id="nameErr"></div>
        </div>

        <div class="field">
          <div class="label-row">
            <label class="field-label" for="phone">手机号</label>
            <span class="required">必填</span>
          </div>
          <p class="field-hint">11 位中国大陆手机号，用于核验报名身份。</p>
          <input class="input" id="phone" name="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="如：13812345678" />
          <div class="error-msg" id="phoneErr"></div>
        </div>

        <div class="field">
          <div class="label-row">
            <span class="field-label">场次选择</span>
            <span class="required">必选</span>
          </div>
          <p class="field-hint">请选择参加的场次，每人仅可参加一场。</p>
          <div class="radio-list" id="sessionList" role="radiogroup" aria-label="场次选择"></div>
          <div class="error-msg" id="sessionErr"></div>
        </div>

        <div class="field">
          <div class="label-row">
            <label class="field-label" for="diet">饮食忌口</label>
            <span class="optional">选填</span>
          </div>
          <p class="field-hint">如有过敏源或忌口，请简要说明，便于我们提前安排。</p>
          <textarea class="textarea" id="diet" name="diet" placeholder="如：花生过敏、素食、不吃海鲜"></textarea>
          <div class="error-msg" id="dietErr"></div>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">提交报名</button>
        </div>
        <p class="submit-hint" id="submitHint">提交前请确认信息无误。</p>
      </form>
    </section>

    <!-- 确认信息区 -->
    <section class="card hidden" id="confirmSection" aria-label="报名确认">
      <h2 class="section-title">报名确认</h2>
      <div class="success-banner" id="successBanner">
        <span aria-hidden="true">✅</span>
        <span>报名已提交成功，以下为本次登记信息。</span>
      </div>
      <div class="confirm-list">
        <div class="confirm-row">
          <span class="confirm-label">姓名</span>
          <span class="confirm-value" id="cName"></span>
        </div>
        <div class="confirm-row">
          <span class="confirm-label">手机号</span>
          <span class="confirm-value" id="cPhone"></span>
        </div>
        <div class="confirm-row">
          <span class="confirm-label">场次</span>
          <span class="confirm-value" id="cSession"></span>
        </div>
        <div class="confirm-row">
          <span class="confirm-label">饮食忌口</span>
          <span class="confirm-value" id="cDiet"></span>
        </div>
      </div>
      <p class="timestamp" id="cTime"></p>
      <div class="actions">
        <button type="button" class="btn btn-ghost" id="backBtn">返回修改</button>
        <button type="button" class="btn btn-primary" id="newBtn">提交新报名</button>
      </div>
    </section>

    <footer class="app-footer">
      © 活动会务组 · 本表单数据仅存储于本地浏览器
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  // ---------- 常量 ----------
  var SESSIONS = [
    {id:"morning", name:"上午场", time:"09:00"},
    {id:"afternoon", name:"下午场", time:"14:00"},
    {id:"evening", name:"晚间场", time:"19:00"},
    {id:"online", name:"线上直播", time:"不限地点 · 同步直播"}
  ];
  var PHONE_RE = /^1[3-9][0-9]{9}$/;
  var STORAGE_PREFIX = "event_registration_";
  var LATEST_KEY = "event_registration_latest";

  // ---------- DOM ----------
  var formSection = document.getElementById("formSection");
  var confirmSection = document.getElementById("confirmSection");
  var form = document.getElementById("regForm");
  var nameInput = document.getElementById("name");
  var phoneInput = document.getElementById("phone");
  var dietInput = document.getElementById("diet");
  var sessionList = document.getElementById("sessionList");
  var submitBtn = document.getElementById("submitBtn");
  var submitHint = document.getElementById("submitHint");
  var toast = document.getElementById("toast");

  var nameErr = document.getElementById("nameErr");
  var phoneErr = document.getElementById("phoneErr");
  var sessionErr = document.getElementById("sessionErr");
  var dietErr = document.getElementById("dietErr");

  var cName = document.getElementById("cName");
  var cPhone = document.getElementById("cPhone");
  var cSession = document.getElementById("cSession");
  var cDiet = document.getElementById("cDiet");
  var cTime = document.getElementById("cTime");
  var backBtn = document.getElementById("backBtn");
  var newBtn = document.getElementById("newBtn");

  // ---------- 渲染场次 ----------
  function renderSessions(){
    var html = "";
    SESSIONS.forEach(function(s){
      html +=
        '<label class="radio-item">' +
          '<input type="radio" name="session" value="' + s.id + '" />' +
          '<span class="radio-dot" aria-hidden="true"></span>' +
          '<span class="radio-text">' +
            '<span class="radio-name">' + s.name + '</span>' +
            '<span class="radio-time">' + s.time + '</span>' +
          '</span>' +
        '</label>';
    });
    sessionList.innerHTML = html;
  }
  renderSessions();

  // ---------- 工具 ----------
  function escapeHtml(str){
    str = (str == null ? "" : String(str));
    return str
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#39;");
  }
  function formatTime(ts){
    var d = new Date(ts);
    var pad = function(n){return n<10?"0"+n:n};
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+
      " "+pad(d.getHours())+":"+pad(d.getMinutes());
  }
  function getSessionById(id){
    for(var i=0;i<SESSIONS.length;i++){if(SESSIONS[i].id===id)return SESSIONS[i]}
    return null;
  }
  function getSelectedSessionId(){
    var radios = sessionList.querySelectorAll('input[name="session"]');
    for(var i=0;i<radios.length;i++){if(radios[i].checked)return radios[i].value}
    return null;
  }
  function setSelectedSession(id){
    var radios = sessionList.querySelectorAll('input[name="session"]');
    for(var i=0;i<radios.length;i++){radios[i].checked = (radios[i].value === id)}
  }

  function setError(input, errEl, msg){
    if(msg){
      input.classList.add("is-error");
      errEl.textContent = msg;
      errEl.classList.add("show");
    }else{
      input.classList.remove("is-error");
      errEl.textContent = "";
      errEl.classList.remove("show");
    }
  }
  function setSessionError(msg){
    if(msg){sessionErr.textContent = msg; sessionErr.classList.add("show")}
    else{sessionErr.textContent=""; sessionErr.classList.remove("show")}
  }
  function clearAllErrors(){
    setError(nameInput, nameErr, "");
    setError(phoneInput, phoneErr, "");
    setError(dietInput, dietErr, "");
    setSessionError("");
  }
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(function(){toast.classList.remove("show")}, 2000);
  }

  // ---------- 校验 ----------
  function validateName(){
    var v = nameInput.value.trim();
    if(!v){
      setError(nameInput, nameErr, "请输入姓名");
      return false;
    }
    if(v.length < 2){
      setError(nameInput, nameErr, "姓名至少 2 个字符");
      return false;
    }
    setError(nameInput, nameErr, "");
    return true;
  }
  function validatePhone(){
    var v = phoneInput.value.trim();
    if(!v){
      setError(phoneInput, phoneErr, "请输入手机号");
      return false;
    }
    if(!/^\d+$/.test(v) || v.length !== 11){
      setError(phoneInput, phoneErr, "请输入 11 位有效手机号");
      return false;
    }
    if(!PHONE_RE.test(v)){
      setError(phoneInput, phoneErr, "手机号格式不正确，需以 1 开头且为 11 位");
      return false;
    }
    setError(phoneInput, phoneErr, "");
    return true;
  }
  function validateSession(){
    var id = getSelectedSessionId();
    if(!id){
      setSessionError("请选择一个场次");
      return false;
    }
    setSessionError("");
    return true;
  }

  // ---------- localStorage ----------
  function safeParse(json, fallback){
    try{ return JSON.parse(json) }catch(e){ return fallback }
  }
  function saveRecord(data){
    try{
      var key = STORAGE_PREFIX + data.phone;
      data.timestamp = Date.now();
      localStorage.setItem(key, JSON.stringify(data));
      localStorage.setItem(LATEST_KEY, key);
      return true;
    }catch(e){
      return false;
    }
  }
  function loadLatestRecord(){
    try{
      var key = localStorage.getItem(LATEST_KEY);
      if(!key) return null;
      var raw = localStorage.getItem(key);
      if(!raw) return null;
      var obj = safeParse(raw, null);
      if(!obj || !obj.phone) return null;
      return obj;
    }catch(e){ return null }
  }

  // ---------- 状态切换 ----------
  function showForm(){
    formSection.classList.remove("hidden");
    confirmSection.classList.add("hidden");
    // 焦点到第一个可编辑字段
    setTimeout(function(){
      if(document.activeElement !== nameInput){
        nameInput.focus({preventScroll:true});
      }
    }, 0);
  }
  function showConfirm(data){
    var sess = getSessionById(data.session) || {name:"未知", time:""};
    cName.textContent = data.name;
    cPhone.textContent = data.phone;
    cSession.innerHTML = '<span class="confirm-badge">' + escapeHtml(sess.name) + '</span> ' + escapeHtml(sess.time);
    cDiet.textContent = (data.diet && data.diet.trim()) ? data.diet : "无";
    cTime.textContent = "提交时间：" + formatTime(data.timestamp);
    formSection.classList.add("hidden");
    confirmSection.classList.remove("hidden");
  }

  // ---------- 回填 ----------
  function fillForm(data){
    nameInput.value = data.name || "";
    phoneInput.value = data.phone || "";
    setSelectedSession(data.session || null);
    dietInput.value = data.diet || "";
  }
  function resetForm(){
    nameInput.value = "";
    phoneInput.value = "";
    phoneInput.removeAttribute("readonly");
    setSelectedSession(null);
    dietInput.value = "";
    clearAllErrors();
    updateSubmitState();
  }

  // 返回修改：手机号置 readonly，点击解锁
  function makePhoneReadonly(){
    phoneInput.setAttribute("readonly","readonly");
    phoneInput.setAttribute("aria-readonly","true");
    phoneInput.title = "点击解锁后可编辑";
  }
  function unlockPhone(){
    if(phoneInput.hasAttribute("readonly")){
      phoneInput.removeAttribute("readonly");
      phoneInput.removeAttribute("aria-readonly");
      phoneInput.title = "";
      showToast("手机号已可编辑");
    }
  }

  // ---------- 提交按钮可用态 ----------
  function updateSubmitState(){
    // 提交按钮始终可点击（点击触发整体校验）；提示信息跟随变化
    var nameOk = nameInput.value.trim().length >= 2;
    var phoneOk = PHONE_RE.test(phoneInput.value.trim());
    var sessOk = !!getSelectedSessionId();
    if(!(nameOk && phoneOk && sessOk)){
      submitHint.textContent = "请填写姓名、11 位手机号并选择场次后提交。";
    }else{
      submitHint.textContent = "信息已就绪，点击提交生成确认卡。";
    }
  }

  // ---------- 事件绑定 ----------
  nameInput.addEventListener("blur", validateName);
  nameInput.addEventListener("input", function(){
    if(nameErr.classList.contains("show")) validateName();
    updateSubmitState();
  });

  phoneInput.addEventListener("blur", validatePhone);
  phoneInput.addEventListener("input", function(){
    // 限制只能数字
    var v = phoneInput.value.replace(/[^\d]/g,"");
    if(v !== phoneInput.value) phoneInput.value = v;
    if(phoneErr.classList.contains("show")) validatePhone();
    updateSubmitState();
  });
  phoneInput.addEventListener("click", unlockPhone);
  phoneInput.addEventListener("focus", unlockPhone);

  sessionList.addEventListener("change", function(){
    setSessionError("");
    updateSubmitState();
  });
  sessionList.addEventListener("click", function(){
    setSessionError("");
    updateSubmitState();
  });

  dietInput.addEventListener("input", function(){
    if(dietErr.classList.contains("show")) dietErr.textContent = "";
  });

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var okName = validateName();
    var okPhone = validatePhone();
    var okSess = validateSession();
    if(!(okName && okPhone && okSess)){
      // 聚焦到第一个出错字段
      if(!okName){ nameInput.focus(); }
      else if(!okPhone){ phoneInput.focus(); }
      else if(!okSess){
        var firstRadio = sessionList.querySelector('input[name="session"]');
        if(firstRadio) firstRadio.focus();
      }
      showToast("请修正表单中的错误后再提交");
      return;
    }
    var data = {
      name: nameInput.value.trim(),
      phone: phoneInput.value.trim(),
      session: getSelectedSessionId(),
      diet: dietInput.value.trim()
    };
    var ok = saveRecord(data);
    if(!ok){
      showToast("本地存储写入失败，请检查浏览器设置");
      return;
    }
    // 提交后清除草稿（确认页即为最新记录，无需额外草稿键）
    var saved = loadLatestRecord();
    if(saved){ showConfirm(saved); }
    else{ showConfirm(data); }
  });

  backBtn.addEventListener("click", function(){
    var rec = loadLatestRecord();
    if(rec){
      fillForm(rec);
      makePhoneReadonly();
      clearAllErrors();
      updateSubmitState();
    }
    showForm();
    showToast("已回填上次报名信息，手机号点击即可编辑");
  });

  newBtn.addEventListener("click", function(){
    resetForm();
    showForm();
    showToast("已清空，可填写新的报名信息");
  });

  // 回车键在手机号/姓名框触发提交由表单原生处理；session radio 也支持原生
  // 初始化
  function init(){
    var rec = loadLatestRecord();
    if(rec && rec.phone && rec.name && rec.session){
      // 直接显示确认页
      showConfirm(rec);
    }else{
      resetForm();
      showForm();
    }
    updateSubmitState();
  }
  init();
})();
</script>
</body>
</html>
