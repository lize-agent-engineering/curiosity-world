services:
  curiosity-world:
    build:
      context: .
      args:
        - ALLOWED_FRAME_ANCESTORS=${ALLOWED_FRAME_ANCESTORS:-}
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    volumes:
      - curiosity-world-data:/app/data
    restart: unless-stopped
  curiosity-worker:
    container_name: curiosity-worker
    build:
      context: .
      target: worker
    env_file:
      - .env.local
    volumes:
      - curiosity-world-data:/app/data
    restart: unless-stopped

volumes:
  curiosity-world-data:
