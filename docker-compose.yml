services:
  curiosity-world:
    container_name: curiosity-world-local
    build:
      context: .
      # `worker` is the last stage in the Dockerfile, so an untargeted build
      # produces the worker image and this service would run the worker instead
      # of the web server. Always pin the stage explicitly.
      target: runner
      args:
        - ALLOWED_FRAME_ANCESTORS=${ALLOWED_FRAME_ANCESTORS:-}
    ports:
      # Host 3100 is what the fixed ngrok address forwards to; host 3000 is
      # taken by another local project. Override with CURIOSITY_HOST_PORT.
      - '${CURIOSITY_HOST_PORT:-3100}:3000'
    env_file:
      - .env.local
    volumes:
      - curiosity-world-data:/app/data
    restart: unless-stopped
  curiosity-worker:
    container_name: curiosity-worker
    build:
      context: .
      target: worker
    env_file:
      - .env.local
    volumes:
      - curiosity-world-data:/app/data
    restart: unless-stopped

volumes:
  curiosity-world-data:
    # Pin the real volume name. Without this, compose prefixes it with the
    # project name and the stack silently comes up on an empty volume instead
    # of the data the manual `docker run -v curiosity-world-data:/app/data`
    # deployment has been writing to.
    name: curiosity-world-data
